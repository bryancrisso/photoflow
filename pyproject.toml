[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photoflow"
version = "0.1.0"
description = "Photography workflow CLI for album initialization, 3-layer XMP/EXIF metadata stamping, digiKam SQLite bridging, and rclone VFS cache management."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pyexiftool>=0.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
photoflow = "photoflow.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
